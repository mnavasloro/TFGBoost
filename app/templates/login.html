<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · TFGBoost</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/auth.css"></head>
<body class="auth-page"><main><section class="card auth-card"><a class="brand" href="/login">TFG<span>Boost</span></a><p class="eyebrow">Acceso seguro</p><h1>Inicia sesión</h1><p class="muted">Accede a tus borradores e informes.</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/login"><label>Correo electrónico<input name="email" type="email" autocomplete="email" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p class="muted">¿No tienes cuenta? <a href="/register">Crear una cuenta</a>.</p></section></main></body></html>
