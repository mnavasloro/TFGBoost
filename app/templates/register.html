<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · TFGBoost</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/auth.css"></head>
<body class="auth-page"><main><section class="card auth-card"><a class="brand" href="/login">TFG<span>Boost</span></a><p class="eyebrow">Primer acceso</p><h1>Crea tu cuenta</h1><p class="muted">Prototipo local: en un piloto real, el alta de tutores debe validarse o proceder del SSO institucional.</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/register"><label>Nombre y apellidos<input name="name" maxlength="120" autocomplete="name" required></label><label>Correo electrónico<input name="email" type="email" autocomplete="email" required></label><label>Perfil<select name="role" required><option value="student">Estudiante</option><option value="tutor">Tutor/a</option></select></label><label>Contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" required><span class="help">Mínimo 10 caracteres.</span></label><button type="submit">Crear cuenta</button></form><p class="muted">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>.</p></section></main></body></html>
